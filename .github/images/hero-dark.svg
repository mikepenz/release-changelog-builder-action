<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">release-changelog-builder-action</title>
  <desc id="d">release-changelog-builder-action: a tag range and its merged pull requests are turned into a categorised CHANGELOG.md</desc>
  <rect x="0" y="0" width="1200" height="400" rx="24" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
<g id="title-block"><text x="64" y="92" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" font-weight="600" fill="#A371F7" letter-spacing="2.4">GITHUB ACTION / RELEASE NOTES</text><text x="64" y="152" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="44" font-weight="700" fill="#E6EDF3">release-changelog-builder-action</text><text x="64" y="196" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#8B949E">Builds your release notes from the pull requests merged between two tags.</text></g>
